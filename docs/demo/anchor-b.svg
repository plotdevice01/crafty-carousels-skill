<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Crafty Carousels demo anchor B</title>
  <desc id="desc">Poster cover reading Stop generating the whole carousel at once.</desc>
  <rect width="1080" height="1350" fill="#102A43"/>
  <text x="540" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#F5F0E8">CRAFTY CAROUSELS • DEMO</text>
  <text x="540" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="900" fill="#F5F0E8">
    <tspan x="540" dy="0">STOP</tspan>
    <tspan x="540" dy="140">GENERATING</tspan>
  </text>
  <rect x="80" y="570" width="920" height="230" rx="28" fill="#FF5A36"/>
  <text x="540" y="720" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="900" fill="#102A43">THE WHOLE</text>
  <text x="540" y="950" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="900" fill="#F5F0E8">
    <tspan x="540" dy="0">CAROUSEL</tspan>
    <tspan x="540" dy="145">AT ONCE</tspan>
  </text>
  <text x="540" y="1240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900" fill="#FF5A36">ANCHOR B • POSTER BLOCK</text>
</svg>
